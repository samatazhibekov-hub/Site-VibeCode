<title>Оқу тарифтері — Вайб-кодинг | Самат Ажибеков</title>
<meta name="description" content="Вайб-кодинг және автоматтандыру бойынша оқу тарифтері.">
<meta name="theme-color" content="#f1f3f5">
<meta name="robots" content="noindex">

<script>
/* =====================================================================
   НАСТРОЙКИ — всё содержание страницы меняется только здесь
   ===================================================================== */

// Дизайн страницы: 3 — «Изумруд и крем» (выбран Саматом 16.11.2026), 0 — прежний зелёный.
var DESIGN = 3;
// Переключатель дизайнов сбоку экрана — только для выбора. Перед публикацией поставить false.
var DESIGN_SWITCHER = false;

// Заголовок. Часть между <b> и </b> выделяется зелёным.
var TITLE = 'Вайб-кодинг үйреніп, <b>табысыңды өсір</b>';

// Номер WhatsApp без плюса и пробелов.
var WHATSAPP_PHONE = '77777088889';

// Таймер: сколько минут идёт отсчёт у каждого посетителя с момента открытия страницы.
// Когда время выходит, отсчёт начинается заново, цена не меняется.
// Отсчёт запоминается в браузере (обновление страницы его не сбрасывает). 0 = таймера нет.
var TIMER_MINUTES = 5;

// Предоплата, чтобы занять место. Пусто = строка не показывается.
var PREPAY = '';            // например '1000 тг'

// Реальные покупатели. Показываются всплывающими уведомлениями внизу экрана по очереди.
// Вписывать только тех, кто действительно купил и не против, что его имя видно.
// tariff — название тарифа точно как в TARIFFS ниже. Пустой список = уведомлений нет.
// Порядок в списке = порядок показа. С каждым уведомлением на экране уменьшаются
// «осталось мест» и «осталось ноутбуков» у этого тарифа — пока не дойдут до настоящих чисел.
var BUYERS = [
  { name: 'Азамат', tariff: 'ОНЛАЙН' },
  { name: 'Ильнура', tariff: 'ОНЛАЙН' },
  { name: 'Дамир', tariff: 'ОНЛАЙН' },
  { name: 'Талғат', tariff: 'ОНЛАЙН' },
  { name: 'Серік', tariff: 'ОНЛАЙН' },
  { name: 'Бекжан', tariff: 'ОФФЛАЙН' },
  { name: 'Нұрлан', tariff: 'ОФФЛАЙН' },
  { name: 'Берік', tariff: 'ОФФЛАЙН' },
  { name: 'Ақтоты', tariff: 'ОНЛАЙН' },
  { name: 'Ермек', tariff: 'ОФФЛАЙН' },
  { name: 'Дидар', tariff: 'ОФФЛАЙН' },
  { name: 'Досбол', tariff: 'ОНЛАЙН' }
];
var PUSH_EVERY_SEC = 5;     // раз во сколько секунд показывать следующее уведомление

// Ноутбуки в подарок: сколько всего — задаётся у каждого тарифа в TARIFFS (поле laptops).
// Остаток = laptops минус число покупателей этого тарифа в списке BUYERS.
// Остался один — «Соңғы 1 ноутбук қалды», ноль — «Ноутбуктар таусылды». laptops: 0 = блока нет.
// Фото ноутбука: положи файл с таким именем рядом с этой страницей.
// Пока файла нет, показывается рисунок.
var LAPTOP_PHOTO = 'noutbuk.webp';

// Тарифы. sub — для кого тариф (строка под названием); badge — метка над названием ('' = нет).
// seatsTotal — сколько мест всего. Остаток считается сам:
// всего мест минус число уже показанных покупателей этого тарифа из списка BUYERS.
// seatsTotal: null = счётчик мест не показывается.
var TARIFFS = [
  {
    name: 'ОНЛАЙН',
    sub: 'Жаңадан бастаушыларға',
    badge: '',
    dark: false,
    items: [
      '4 апта онлайн оқу, аптасына 2 тікелей сабақ',
      'Claude және ChatGPT-мен вайб-кодинг: нөлден бастап',
      '3 дайын жоба: сайт, Telegram-бот, автоматтандыру',
      'Жабық чат пен куратор қолдауы — 2 ай',
      'Сабақ жазбаларына 6 ай қолжетімділік'
    ],
    gifts: [
      'Дайын промпттар жинағы',
      'Жеке ассистент құру сабағы'
    ],
    oldPrice: '600 000 ₸',
    price: '390 000 ₸',
    seatsTotal: 50,
    laptops: 50
  },
  {
    name: 'ОФФЛАЙН',
    sub: 'Кәсіпкерлерге арналған пакет',
    badge: 'VIP',
    dark: true,
    items: [
      '«Онлайн» тарифіндегінің бәрі',
      'Самат Ажибековпен 3 жеке кеңес',
      'Өз бизнесіңізге автоматтандыруды бірге жасаймыз',
      'Алматыда 3 оффлайн кездесу',
      'Жабық чат пен қолдау — 4 ай',
      'Сабақ жазбаларына 12 ай қолжетімділік'
    ],
    gifts: [
      'Дайын промпттар жинағы',
      'Жеке ассистент құру сабағы'
    ],
    oldPrice: '1 300 000 ₸',
    price: '790 000 ₸',
    seatsTotal: 10,
    laptops: 10
  }
];

// Отзывы учеников. Показываются после тарифов, листаются вбок.
//   name  — имя; role — кто он (город, профессия), можно оставить пустым '';
//   text  — что написал;
//   photo — файл с фото человека рядом с этой страницей (пусто = кружок с первой буквой имени);
//   image — если отзыв это скриншот переписки: имя файла картинки. Тогда text можно не писать.
// Пустой список [] = блок отзывов не показывается.
var REVIEWS_TITLE = 'Оқушылардың пікірлері';
var REVIEWS = [
  { name: 'Азамат', role: 'Алматы қаласы, кәсіпкер', photo: '', image: '',
    text: 'Самат мырза сізге рахмет, вайбкодинг арқылы өзімнің кәсібіме приложение жасап алдым, күнделікті контентті осы ИИ арқылы өзім жасап жатырмын. Бұрын СММ, мобилограф, контент мейкер жалдап біраз ақша шығындалып жүріппін, қазір жұмысым жеңілдеп қалды.' },
  { name: 'Дидар', role: 'Алматы қаласы, фрилансер', photo: '', image: '',
    text: 'Сәке мен бір проект алдым, бір кәсіпкерге СРМ, приложение, ИИ менеджер жасап беріп жатырмын.' },
  { name: 'Ақтоты', role: 'Астана қаласы, SMM', photo: '', image: '',
    text: 'Мен осы обучениеден кейін өзімнің чегімді көтеріп алдым рахмет және бұрын максимум 2-3 проект қана алсам қазір өзіме ИИ ассистент жасап алдым осы айда 4 проект жасаппын, күштііі маған ұнап жатыр.' }
];

// Голосовые отзывы — выглядят как голосовые сообщения в WhatsApp.
// Стоят между тарифами и текстовыми отзывами.
//   name  — имя; photo — фото (пусто = кружок с первой буквой);
//   audio — файл рядом со страницей (m4a или mp3; голосовые из WhatsApp Claude переконвертирует);
//   note  — одна строка под сообщением: о чём отзыв (необязательно, '' = нет);
//   time  — время в углу сообщения, как в WhatsApp.
// Пустой список [] = блок не показывается.
var VOICES_TITLE = 'Дауыстық пікірлер';
// Пока настоящих голосовых нет, блок скрыт. Шаблон ниже: раскомментировать и вписать.
var VOICES = [];
// var VOICES = [
//  { name: '[Аты-жөні 1]', photo: '', audio: 'test-voice.m4a', time: '14:32',
//    note: '[Қысқаша: нәтижесі — мысалы, «алғашқы тапсырыс 150 000 ₸»]' },
//  { name: '[Аты-жөні 2]', photo: '', audio: 'test-voice.m4a', time: '18:05',
//    note: '[Қысқаша: нәтижесі]' },
//  { name: '[Аты-жөні 3]', photo: '', audio: 'test-voice.m4a', time: '21:47',
//    note: '' }
// ];
/* ===================================================================== */
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700;800&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f1f3f5;
    --ink: #17191c;
    --muted: #7b828c;
    --green: #22c55e;
    --green-2: #86efac;
    --green-dark: #16a34a;
    --yellow: #fde047;
    --card: #ffffff;
    --line: #e3e6ea;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    background: linear-gradient(180deg, #ffffff 0%, var(--bg) 30%, #e6e9ed 100%);
    color: var(--ink);
    font-family: Onest, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    letter-spacing: -.01em;
    display: flex;
    justify-content: center;
    padding: 20px 12px calc(28px + env(safe-area-inset-bottom));
  }
  main { width: 100%; max-width: 440px; }

  /* Тарифы стоят рядом: на телефоне листаются вбок, на широком экране видны оба */
  #cards {
    display: flex;
    gap: 12px;
    margin: 0 -12px;
    padding: 0 12px 26px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  #cards::-webkit-scrollbar { display: none; }
  .dots { display: flex; justify-content: center; gap: 7px; margin-top: -12px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: #c9ced5; transition: background .2s, width .2s; }
  .dots i.on { width: 20px; border-radius: 4px; background: var(--green); }
  @media (min-width: 720px) {
    main { max-width: 860px; }
    #cards { overflow: visible; margin: 0; padding: 0 0 26px; }
    #cards .card { flex: 1 1 0; }
    .dots { display: none; }
  }

  h1 {
    text-align: center;
    font-size: clamp(21px, 6.2vw, 26px);
    line-height: 1.2;
    font-weight: 800;
    letter-spacing: -.025em;
    text-wrap: balance;
  }
  h1 b { color: var(--green-dark); font-weight: 800; }

  .card {
    flex: 0 0 86%;
    scroll-snap-align: center;
    display: flex;
    flex-direction: column;
    margin-top: 18px;
    padding: 20px 16px 16px;
    border-radius: 24px;
    background: var(--card);
    box-shadow: 0 16px 40px rgba(23,25,28,.10);
  }
  .card.dark { background: #17191c; color: #f3f6f9; --line: #2c3138; --muted: #9aa2ad; }

  .name {
    text-align: center;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: .28em;
    margin-right: -.28em;
  }
  .items { list-style: none; margin-top: 14px; }
  .items li {
    position: relative;
    padding: 5px 0 5px 20px;
    font-size: 14px;
    font-weight: 500;
    line-height: 1.4;
  }
  .items li::before {
    content: "";
    position: absolute;
    left: 3px; top: .82em;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
  }

  .gifts {
    margin-top: 14px;
    padding: 12px 14px 13px;
    border-radius: 16px;
    background: linear-gradient(120deg, #3fb56b 0%, #5fd38a 55%, var(--green-2) 100%);
    color: #fff;
  }
  .laptop {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,.35);
  }
  .laptop .txt { flex: 1; min-width: 0; }
  .laptop b { display: block; font-size: 14.5px; font-weight: 800; line-height: 1.25; }
  .laptop .left {
    display: inline-block;
    margin-top: 6px;
    padding: 3px 9px;
    border-radius: 999px;
    background: rgba(255,255,255,.92);
    color: var(--ink);
    font-size: 12px;
    font-weight: 600;
  }
  .laptop .left i { font-style: normal; font-weight: 800; color: var(--green-dark); }
  .laptop .pic { flex: none; width: 96px; }
  .laptop .pic img, .laptop .pic svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 6px 10px rgba(0,0,0,.22)); }

  .laptop .left i.last { color: #dc2626; }
  .laptop.none .pic { opacity: .45; filter: grayscale(1); }

  .gifts .tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--yellow);
    color: var(--ink);
    font-size: 12px;
    font-weight: 700;
  }
  .gifts ul { list-style: none; margin-top: 8px; }
  .gifts li { position: relative; padding: 3px 0 3px 16px; font-size: 13.5px; font-weight: 600; line-height: 1.35; }
  .gifts li::before { content: "🎁"; position: absolute; left: -3px; top: 3px; font-size: 11px; }

  .price { margin-top: auto; padding-top: 16px; text-align: center; }
  .price s { display: block; color: var(--muted); font-size: 16px; font-weight: 600; }
  .price strong { display: block; font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; }
  .prepay { margin-top: 4px; color: var(--muted); font-size: 13px; font-weight: 500; }
  .prepay b { color: inherit; font-weight: 700; }
  .card.dark .prepay b, .card:not(.dark) .prepay b { color: var(--green); }

  .timer {
    margin-top: 14px;
    padding: 8px 8px 9px;
    border: 1px solid var(--line);
    border-radius: 14px;
    text-align: center;
  }
  .timer span { display: block; font-size: 11px; font-weight: 500; color: var(--muted); }
  .timer b { display: block; font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.15; letter-spacing: .02em; }
  .timer.low b { color: #dc2626; }
  .card.dark .timer.low b { color: #f87171; }

  .seats { margin-top: 12px; font-size: 13px; font-weight: 600; text-align: center; }
  .seats b { color: var(--green); font-weight: 800; }
  .seats .bar { height: 6px; margin-top: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .seats .bar i { display: block; height: 100%; border-radius: 3px; background: var(--green); }

  /* --- Отзывы --- */
  .reviews { margin-top: 34px; }
  .reviews h2, .voices h2 {
    text-align: center;
    font-size: clamp(19px, 5.4vw, 22px);
    font-weight: 800;
    letter-spacing: -.02em;
  }
  .reviews .row {
    display: flex;
    gap: 12px;
    margin: 0 -12px;
    padding: 14px 12px 22px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .reviews .row::-webkit-scrollbar { display: none; }
  .review {
    flex: 0 0 82%;
    scroll-snap-align: center;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 16px;
    border-radius: 20px;
    background: var(--card);
    box-shadow: 0 10px 28px rgba(23,25,28,.08);
  }
  .review .who { display: flex; align-items: center; gap: 10px; }
  .review .ava {
    flex: none;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(34,197,94,.16);
    color: var(--green-dark);
    display: grid;
    place-items: center;
    font-size: 18px;
    font-weight: 800;
    overflow: hidden;
  }
  .review .ava img { width: 100%; height: 100%; object-fit: cover; }
  .review .who b { display: block; font-size: 14.5px; font-weight: 700; line-height: 1.25; }
  .review .who span { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
  .review p { position: relative; font-size: 14px; font-weight: 500; line-height: 1.5; color: #3d434b; }
  .review p::before {
    content: "“";
    display: block;
    height: 18px;
    font-size: 40px;
    line-height: 1;
    font-weight: 800;
    color: var(--green);
  }
  .review .shot { width: 100%; border-radius: 12px; border: 1px solid var(--line); }
  .reviews .dots { margin-top: -8px; }
  @media (min-width: 720px) {
    .reviews .row { overflow: visible; margin: 0; padding: 14px 0 0; flex-wrap: wrap; }
    .review { flex: 1 1 30%; }
  }

  /* --- Голосовые отзывы в стиле WhatsApp --- */
  .voices { margin-top: 30px; }
  /* Голосовые стоят в ряд и листаются вбок: следующее выглядывает из-за края экрана */
  .vrowbox {
    display: flex;
    gap: 12px;
    margin: 0 -12px;
    padding: 14px 12px 22px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .vrowbox::-webkit-scrollbar { display: none; }
  .chat {
    flex: 0 0 86%;
    scroll-snap-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 18px 12px 16px 16px;
    border-radius: 20px;
    background-color: #efeae2;
    background-image: radial-gradient(rgba(0,0,0,.035) 1.2px, transparent 1.3px);
    background-size: 14px 14px;
    box-shadow: 0 10px 28px rgba(23,25,28,.08);
  }
  .vmsg { width: 100%; }
  .voices .dots { margin-top: -8px; }
  @media (min-width: 720px) {
    .vrowbox { overflow: visible; margin: 0; padding: 14px 0 0; flex-wrap: wrap; }
    .chat { flex: 1 1 30%; }
    .voices .dots { display: none; }
  }
  .vbubble {
    position: relative;
    padding: 6px 10px 18px 8px;
    border-radius: 0 12px 12px 12px;
    background: #fff;
    box-shadow: 0 1px 1px rgba(11,20,26,.13);
  }
  .vbubble::before {            /* «хвостик» сообщения */
    content: "";
    position: absolute;
    left: -7px; top: 0;
    border-top: 0 solid transparent;
    border-right: 8px solid #fff;
    border-bottom: 10px solid transparent;
  }
  .vname { font-size: 12.5px; font-weight: 700; color: #1f9e55; margin: 0 0 2px 2px; }
  .vrow { display: flex; align-items: center; gap: 6px; }
  .vplay {
    flex: none;
    width: 34px; height: 34px;
    border: 0;
    background: none;
    color: #54656f;
    display: grid;
    place-items: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .vplay svg { width: 26px; height: 26px; }
  .vwave {
    position: relative;
    flex: 1;
    min-width: 0;
    height: 30px;
    display: flex;
    align-items: center;
    gap: 2px;
    cursor: pointer;
    touch-action: none;
  }
  .vwave span { flex: 1; min-width: 2px; border-radius: 2px; background: #c4cbd0; }
  .vwave span.on { background: #22c55e; }
  .vwave .knob {
    position: absolute;
    top: 50%; left: 0;
    width: 12px; height: 12px;
    margin: -6px 0 0 -6px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 1px 2px rgba(0,0,0,.25);
    pointer-events: none;
  }
  .vside { position: relative; flex: none; width: 44px; height: 44px; margin-left: 4px; }
  .vava {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: #dfe5e7;
    color: #54656f;
    display: grid;
    place-items: center;
    font-size: 17px;
    font-weight: 700;
    overflow: hidden;
  }
  .vava img { width: 100%; height: 100%; object-fit: cover; }
  .vmic {
    position: absolute;
    left: -4px; bottom: -2px;
    width: 18px; height: 18px;
    color: #22c55e;
    filter: drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1.5px #fff);
  }
  .vmsg.played .vmic { color: #53bdeb; }
  .vspeed {
    display: none;
    position: absolute;
    inset: 9px 2px;
    border: 0;
    border-radius: 13px;
    background: #8696a0;
    color: #fff;
    font: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .vmsg.playing .vava, .vmsg.playing .vmic { display: none; }
  .vmsg.playing .vspeed { display: block; }
  .vdur { position: absolute; left: 50px; bottom: 4px; font-size: 11px; color: #667781; font-variant-numeric: tabular-nums; }
  .vtime { position: absolute; right: 10px; bottom: 4px; font-size: 11px; color: #667781; }
  .vnote { margin: 5px 0 0 4px; font-size: 12.5px; font-weight: 600; color: #3d434b; }

  /* Всплывающее уведомление о покупке */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(14px + env(safe-area-inset-bottom));
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
    width: max-content;
    max-width: calc(100vw - 24px);
    padding: 9px 14px 9px 10px;
    border-radius: 16px;
    background: rgba(255,255,255,.96);
    box-shadow: 0 12px 34px rgba(23,25,28,.24);
    color: var(--ink);
    font-size: 13px;
    line-height: 1.3;
    transform: translate(-50%, 150%);
    opacity: 0;
    transition: transform .45s cubic-bezier(.2,.9,.3,1.15), opacity .3s;
    pointer-events: none;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  .toast .ok {
    flex: none;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--green);
    display: grid;
    place-items: center;
  }
  .toast .ok svg { width: 16px; height: 16px; }
  .toast b { display: block; font-weight: 700; }
  .toast span { color: #5a616b; font-weight: 500; }
  .toast span i { font-style: normal; font-weight: 700; color: var(--green-dark); }
  @media (prefers-reduced-motion: reduce) { .toast { transition: opacity .3s; } }

  .btn {
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    height: 54px;
    margin-top: 12px;
    border-radius: 16px;
    background: linear-gradient(100deg, var(--green) 0%, #4ade80 55%, var(--green-2) 100%);
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    text-decoration: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.18);
    box-shadow: 0 12px 26px rgba(34,197,94,.38);
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: translateY(1px); filter: brightness(.95); }
  .btn svg { width: 23px; height: 23px; flex: none; }
  .btn::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0; left: 0;
    width: 45%;
    background: linear-gradient(100deg, transparent 0%, rgba(255,255,255,.65) 50%, transparent 100%);
    transform: translateX(-130%) skewX(-18deg);
    animation: shine 2.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes shine {
    0%, 55% { transform: translateX(-130%) skewX(-18deg); }
    100% { transform: translateX(340%) skewX(-18deg); }
  }
  @media (prefers-reduced-motion: reduce) { .btn::after { animation: none; } }

  /* =========================================================================
     Шрифты и компактный первый экран (16.11.2026): кнопка «Орын аламын»
     должна быть видна сразу при открытии страницы на телефоне.
     Заголовки, названия тарифов, цены и кнопки — Montserrat, текст — Onest.
     ========================================================================= */
  h1, .name, .price strong, .timer b, .btn, .reviews h2, .voices h2, .laptop b {
    font-family: Montserrat, Onest, sans-serif;
  }
  body { padding-top: 12px; }
  h1 { font-size: clamp(17px, 5vw, 21px); line-height: 1.25; font-weight: 800; letter-spacing: -.02em; }
  .reviews h2, .voices h2 { font-size: clamp(16px, 4.6vw, 19px); font-weight: 700; }

  .card { margin-top: 15px; padding: 16px 16px 14px; border-radius: 22px; }
  .name { font-size: 16px; font-weight: 800; letter-spacing: .22em; margin-right: -.22em; }
  .items { margin-top: 9px; }
  .items li { padding: 3.5px 0 3.5px 18px; font-size: 13px; font-weight: 600; line-height: 1.38; }
  .items li::before { left: 2px; top: .85em; width: 6px; height: 6px; }

  .gifts { position: relative; margin-top: 11px; padding: 11px 13px 11px; border-radius: 16px; }
  .laptop { gap: 10px; margin-bottom: 9px; padding-bottom: 10px; }
  .laptop b { font-size: 11.5px; font-weight: 700; line-height: 1.3; letter-spacing: -.01em; }
  .laptop .left { margin-top: 6px; padding: 3px 9px; font-size: 11.5px; }
  .laptop .pic { width: 62px; }
  .gifts .tag { position: absolute; right: 12px; bottom: 12px; padding: 2px 8px; font-size: 10.5px; }
  .gifts ul { margin-top: 0; padding-right: 70px; }
  .gifts li { padding: 3px 0 3px 16px; font-size: 12.5px; line-height: 1.35; }
  .gifts li::before { top: 3px; font-size: 10px; }

  .price {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: baseline;
    gap: 2px 10px;
    padding-top: 15px;
  }
  .price s { display: inline; font-size: 13px; }
  .price strong { display: inline; font-size: 23px; font-weight: 800; letter-spacing: -.03em; }
  .prepay { flex-basis: 100%; margin-top: 0; font-size: 12px; }

  .timer {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 11px;
    padding: 7px 8px;
    border-radius: 12px;
  }
  .timer span { display: inline; font-size: 11.5px; }
  .timer b { display: inline; font-size: 15px; font-weight: 700; letter-spacing: 0; }

  .btn { height: 52px; margin-top: 11px; border-radius: 14px; font-size: 14.5px; font-weight: 700; letter-spacing: -.01em; }
  .btn svg { width: 21px; height: 21px; }
  .seats { margin-top: 11px; font-size: 12px; }
  .seats .bar { height: 5px; margin-top: 4px; }
  #cards { padding-bottom: 22px; }

  /* Подсказка «листай вбок»: ряд тарифов сам сдвигается влево и возвращается */
  @keyframes nudge {
    0%, 100% { transform: translateX(0); }
    35%      { transform: translateX(-64px); }
    55%      { transform: translateX(-58px); }
  }
  #cards.nudge .card { animation: nudge 1.5s cubic-bezier(.4,0,.2,1); }
  @media (prefers-reduced-motion: reduce), (min-width: 720px) { #cards.nudge .card { animation: none; } }

  /* ===== Общие новые элементы карточки: метка и строка «для кого» ===== */
  .card { position: relative; }
  .badge {                    /* метка сидит на верхней кромке карточки и не добавляет высоты */
    position: absolute;
    top: -11px; left: 50%;
    transform: translateX(-50%);
    padding: 4px 16px;
    box-shadow: 0 4px 10px rgba(0,0,0,.18);
    border-radius: 999px;
    background: var(--yellow);
    color: #17191c;
    font-family: Montserrat, Onest, sans-serif;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .16em;
  }
  .sub { margin-top: 3px; text-align: center; font-size: 11.5px; font-weight: 600; color: var(--muted); }
  .btn svg { fill: currentColor; }

  /* Переключатель дизайнов (только для выбора варианта) */
  .dsw {
    position: fixed;
    right: 6px; top: 34%;
    z-index: 30;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 7px 5px;
    border-radius: 14px;
    background: rgba(23,25,28,.86);
    color: #fff;
    font-family: Onest, sans-serif;
    box-shadow: 0 8px 22px rgba(0,0,0,.3);
  }
  .dsw span { font-size: 8.5px; font-weight: 700; letter-spacing: .04em; opacity: .7; }
  .dsw em { max-width: 44px; font-style: normal; font-size: 8px; font-weight: 600; text-align: center; line-height: 1.15; opacity: .85; }
  .dsw button {
    width: 30px; height: 30px;
    border: 0; border-radius: 50%;
    background: rgba(255,255,255,.14);
    color: #fff;
    font: 700 13px Onest, sans-serif;
    cursor: pointer;
  }
  .dsw button.on { background: #22c55e; }

  /* ================= ВАРИАНТ 3 — «Изумруд и крем» =================
     Тёплый спокойный фон. Онлайн: кремовая карточка без теней. Офлайн: глубокий изумруд с золотистым. */
  body[data-design="3"] {
    --green: #12a383; --green-2: #7fd8c0; --green-dark: #0f766e; --line: #e6dcc8; --muted: #8b8371;
    background: #f6f0e4;
  }
  body[data-design="3"] .card:not(.dark) { background: #fffdf8; border: 1px solid #e6dcc8; box-shadow: none; border-radius: 18px; }
  body[data-design="3"] .card:not(.dark) .gifts { background: #e9f4ee; color: #17191c; }
  body[data-design="3"] .card:not(.dark) .laptop { border-bottom-color: #cfe5da; }
  body[data-design="3"] .card:not(.dark) .btn { background: linear-gradient(100deg, #0f766e, #12a383); box-shadow: 0 10px 22px rgba(15,118,110,.32); }
  body[data-design="3"] .card.dark {
    --green: #f0d9a0; --green-2: #f8ebc8; --green-dark: #f0d9a0; --line: rgba(240,217,160,.28); --muted: #a9c2b8;
    background: linear-gradient(165deg, #12493c 0%, #0b2f27 100%);
    color: #f8f3e6; border-radius: 18px;
    box-shadow: 0 18px 40px rgba(11,47,39,.4);
  }
  body[data-design="3"] .card.dark .name { color: #f0d9a0; }
  body[data-design="3"] .card.dark .badge { background: #f0d9a0; }
  body[data-design="3"] .card.dark .gifts { background: rgba(255,255,255,.07); border: 1px solid rgba(240,217,160,.4); color: #f8f3e6; }
  body[data-design="3"] .card.dark .laptop { border-bottom-color: rgba(240,217,160,.25); }
  body[data-design="3"] .card.dark .laptop .left i { color: #0f766e; }
  body[data-design="3"] .card.dark .btn { background: linear-gradient(100deg, #e3c57e, #f6e7bd); color: #0b2f27; text-shadow: none; box-shadow: 0 12px 26px rgba(0,0,0,.3); }
  body[data-design="3"] .review { background: #fffdf8; border: 1px solid #e6dcc8; box-shadow: none; }
  body[data-design="3"] .gifts .tag { background: #f0d9a0; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <div id="cards"></div>
  <div class="dots" id="dots" aria-hidden="true"></div>
  <section class="voices" id="voices" hidden>
    <h2 id="voicesTitle"></h2>
    <div class="vrowbox" id="voicesChat"></div>
    <div class="dots" id="voicesDots" aria-hidden="true"></div>
  </section>

  <section class="reviews" id="reviews" hidden>
    <h2 id="reviewsTitle"></h2>
    <div class="row" id="reviewsRow"></div>
    <div class="dots" id="reviewsDots" aria-hidden="true"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</main>

<script>
(function () {
  var WA_ICON = '<svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.600 15.100L2 22l5-1.300A10 10 0 1 0 12 2zm0 18.200a8.200 8.200 0 0 1-4.200-1.150l-.300-.180-3 .780.800-2.900-.200-.300A8.200 8.200 0 1 1 12 20.200zm4.500-6.150c-.250-.120-1.460-.720-1.690-.800-.230-.080-.390-.120-.560.120-.160.250-.640.800-.780.970-.140.160-.290.180-.530.060a6.700 6.700 0 0 1-1.980-1.220 7.400 7.400 0 0 1-1.370-1.700c-.140-.250-.020-.380.110-.500.110-.110.250-.290.370-.430.120-.140.160-.250.250-.410.080-.160.040-.310-.020-.430-.060-.120-.560-1.340-.760-1.840-.200-.480-.410-.420-.560-.420h-.480a.920.920 0 0 0-.660.310 2.800 2.800 0 0 0-.870 2.070c0 1.220.890 2.400 1.010 2.560.120.160 1.750 2.670 4.230 3.740.590.260 1.050.410 1.410.520.590.190 1.130.160 1.560.100.480-.070 1.460-.600 1.670-1.170.200-.580.200-1.070.140-1.170-.060-.110-.220-.170-.470-.290z"/></svg>';

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function list(arr) {
    return arr.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('');
  }

  document.getElementById('title').innerHTML = TITLE;

  /* ---------- Дизайн страницы ---------- */
  var design = DESIGN;
  if (DESIGN_SWITCHER) {
    var NAMES = ['Бұрынғы', '', '', 'Изумруд'];
    try {
      var q = new URLSearchParams(location.search).get('d');
      var st = localStorage.getItem('tarif_design_v2');
      if (q !== null) design = Number(q) || 0; else if (st !== null) design = Number(st) || 0;
    } catch (e) {}
    var sw = document.createElement('div');
    sw.className = 'dsw';
    sw.innerHTML = '<span>Дизайн</span>' + NAMES.map(function (n, i) {
      return '<button type="button" data-d="' + i + '" title="' + n + '">' + i + '</button>';
    }).join('') + '<em></em>';
    document.body.appendChild(sw);
    var setDesign = function (d) {
      design = d;
      document.body.setAttribute('data-design', d);
      var bs = sw.querySelectorAll('button');
      for (var i = 0; i < bs.length; i++) bs[i].className = i === d ? 'on' : '';
      sw.querySelector('em').textContent = NAMES[d];
      try { localStorage.setItem('tarif_design_v2', String(d)); } catch (e) {}
    };
    sw.addEventListener('click', function (e) {
      var d = e.target.getAttribute && e.target.getAttribute('data-d');
      if (d !== null && d !== undefined) setDesign(Number(d));
    });
    setDesign(design);
  } else {
    document.body.setAttribute('data-design', design);
  }

  var LAPTOP_SVG = '<svg viewBox="0 0 120 80" aria-hidden="true">' +
    '<rect x="18" y="6" width="84" height="54" rx="5" fill="#2b2f36"/>' +
    '<rect x="22" y="10" width="76" height="46" rx="2" fill="#dfe6ee"/>' +
    '<path d="M30 20h34M30 28h50M30 36h26M30 44h42" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>' +
    '<path d="M6 62h108l-6 9a6 6 0 0 1-5 3H17a6 6 0 0 1-5-3z" fill="#c9ced5"/>' +
    '<rect x="48" y="63" width="24" height="3" rx="1.5" fill="#9aa2ad"/></svg>';

  var hasTimer = TIMER_MINUTES > 0;

  document.getElementById('cards').innerHTML = TARIFFS.map(function (t) {
    var wa = 'https://wa.me/' + WHATSAPP_PHONE + '?text=' +
      encodeURIComponent('Сәлеметсіз бе! «' + t.name + '» тарифі бойынша орын алғым келеді');
    var seats = t.seatsTotal ? '<div class="seats" data-seats></div>' : '';
    var laptopHtml = t.laptops > 0
      ? '<div class="laptop"><div class="txt"><b>Алғашқы ' + esc(t.laptops) + ' сатып алушыға — ноутбук</b>' +
        '<span class="left" data-laptops></span></div><div class="pic" data-laptop-pic>' + LAPTOP_SVG + '</div></div>'
      : '';
    return '<section class="card' + (t.dark ? ' dark' : '') + '">' +
      (t.badge ? '<div class="badge">' + esc(t.badge) + '</div>' : '') +
      '<div class="name">' + esc(t.name) + '</div>' +
      (t.sub ? '<div class="sub">' + esc(t.sub) + '</div>' : '') +
      '<ul class="items">' + list(t.items) + '</ul>' +
      (t.gifts && t.gifts.length
        ? '<div class="gifts">' + laptopHtml + '<span class="tag">Сыйлыққа</span><ul>' + list(t.gifts) + '</ul></div>' : '') +
      '<div class="price">' + (t.oldPrice ? '<s>' + esc(t.oldPrice) + '</s>' : '') +
        '<strong data-price="' + esc(t.price) + '" data-old="' + esc(t.oldPrice || t.price) + '">' + esc(t.price) + '</strong>' +
        (PREPAY ? '<div class="prepay">Дәл қазір <b>' + esc(PREPAY) + '</b> жіберіп орын ал</div>' : '') +
      '</div>' +
      (hasTimer ? '<div class="timer" data-timer></div>' : '') +
      '<a class="btn" href="' + wa + '" target="_blank" rel="noopener">' + WA_ICON + 'Орын аламын</a>' +
      seats +
    '</section>';
  }).join('');

  /* ---------- Фото ноутбука: если файл есть, ставим его вместо рисунка ---------- */
  if (LAPTOP_PHOTO) {
    var probe = new Image();
    probe.onload = function () {
      var pics = document.querySelectorAll('[data-laptop-pic]');
      for (var i = 0; i < pics.length; i++) pics[i].innerHTML = '<img src="' + esc(LAPTOP_PHOTO) + '" alt="Ноутбук">';
    };
    probe.src = LAPTOP_PHOTO;
  }

  /* ---------- Точки-подсказка: какой тариф сейчас на экране ---------- */
  var cardsBox = document.getElementById('cards');
  var cards = cardsBox.querySelectorAll('.card');
  var dots = document.getElementById('dots');
  dots.innerHTML = TARIFFS.map(function () { return '<i></i>'; }).join('');
  function markDot() {
    var mid = cardsBox.scrollLeft + cardsBox.clientWidth / 2, best = 0, bestD = Infinity;
    for (var i = 0; i < cards.length; i++) {
      var d = Math.abs(cards[i].offsetLeft - cardsBox.offsetLeft + cards[i].offsetWidth / 2 - mid);
      if (d < bestD) { bestD = d; best = i; }
    }
    for (var j = 0; j < dots.children.length; j++) dots.children[j].className = j === best ? 'on' : '';
  }
  cardsBox.addEventListener('scroll', markDot, { passive: true });
  markDot();

  /* ---------- Подсказка: ряд тарифов сам чуть сдвигается, пока человек его не тронул ---------- */
  var touched = false, nudges = 0;
  var stopNudge = function () { touched = true; cardsBox.classList.remove('nudge'); };
  cardsBox.addEventListener('pointerdown', stopNudge, { passive: true });
  cardsBox.addEventListener('touchstart', stopNudge, { passive: true });
  cardsBox.addEventListener('wheel', stopNudge, { passive: true });
  var nudge = function () {
    if (touched || cardsBox.scrollLeft > 4) return;
    nudges++;
    cardsBox.classList.remove('nudge');
    void cardsBox.offsetWidth;            // перезапуск анимации
    cardsBox.classList.add('nudge');
    setTimeout(nudge, 3000);            // повтор каждые 3 секунды, пока человек не тронул ряд
  };
  setTimeout(nudge, 1000);

  /* ---------- Голосовые отзывы ---------- */
  if (VOICES.length) {
    var ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.1v13.8a.8.8 0 0 0 1.2.7l10.6-6.9a.8.8 0 0 0 0-1.4L9.2 4.4A.8.8 0 0 0 8 5.1z"/></svg>';
    var ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
    var ICON_MIC = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/></svg>';
    var BARS = 34;
    var fmt = function (sec) {
      sec = Math.max(0, Math.floor(sec || 0));
      return Math.floor(sec / 60) + ':' + (sec % 60 < 10 ? '0' : '') + (sec % 60);
    };
    // Полоски «волны»: постоянные для каждого сообщения, зависят от имени
    var bars = function (seed) {
      var h = 0, out = '';
      for (var c = 0; c < seed.length; c++) h = (h * 31 + seed.charCodeAt(c)) >>> 0;
      for (var i = 0; i < BARS; i++) {
        h = (h * 1103515245 + 12345) >>> 0;
        var v = 18 + (h % 82);
        if (i < 2 || i > BARS - 3) v = Math.min(v, 30);
        out += '<span style="height:' + v + '%"></span>';
      }
      return out;
    };

    var chat = document.getElementById('voicesChat');
    document.getElementById('voicesTitle').textContent = VOICES_TITLE;
    chat.innerHTML = VOICES.map(function (v, k) {
      var letter = (v.name || '?').replace(/^[^A-Za-zА-Яа-яЁёӘәҒғҚқҢңӨөҰұҮүҺһІі]+/, '').charAt(0).toUpperCase() || '?';
      return '<div class="chat"><div class="vmsg">' +
        '<div class="vbubble">' +
          '<div class="vname">' + esc(v.name) + '</div>' +
          '<div class="vrow">' +
            '<button class="vplay" type="button" aria-label="Тыңдау">' + ICON_PLAY + '</button>' +
            '<div class="vwave" role="slider" aria-label="Жазба орны">' + bars(v.name + k) + '<i class="knob"></i></div>' +
            '<div class="vside">' +
              '<div class="vava">' + (v.photo ? '<img src="' + esc(v.photo) + '" alt="">' : esc(letter)) + '</div>' +
              '<div class="vmic">' + ICON_MIC + '</div>' +
              '<button class="vspeed" type="button" aria-label="Жылдамдық">1×</button>' +
            '</div>' +
          '</div>' +
          '<span class="vdur">0:00</span>' +
          (v.time ? '<span class="vtime">' + esc(v.time) + '</span>' : '') +
          '<audio preload="metadata" src="' + esc(v.audio) + '"></audio>' +
        '</div>' +
        (v.note ? '<div class="vnote">' + esc(v.note) + '</div>' : '') +
      '</div></div>';
    }).join('');

    // Точки под рядом: какое голосовое сейчас на экране
    var vDots = document.getElementById('voicesDots');
    var vCards = chat.querySelectorAll('.chat');
    vDots.innerHTML = VOICES.map(function () { return '<i></i>'; }).join('');
    var markVoice = function () {
      var mid = chat.scrollLeft + chat.clientWidth / 2, best = 0, bestD = Infinity;
      for (var i = 0; i < vCards.length; i++) {
        var d = Math.abs(vCards[i].offsetLeft - chat.offsetLeft + vCards[i].offsetWidth / 2 - mid);
        if (d < bestD) { bestD = d; best = i; }
      }
      for (var j = 0; j < vDots.children.length; j++) vDots.children[j].className = j === best ? 'on' : '';
    };
    chat.addEventListener('scroll', markVoice, { passive: true });

    var msgs = chat.querySelectorAll('.vmsg');
    var players = [];
    Array.prototype.forEach.call(msgs, function (msg) {
      var audio = msg.querySelector('audio');
      var btn = msg.querySelector('.vplay');
      var wave = msg.querySelector('.vwave');
      var spans = wave.querySelectorAll('span');
      var knob = wave.querySelector('.knob');
      var dur = msg.querySelector('.vdur');
      var speedBtn = msg.querySelector('.vspeed');
      var speeds = [1, 1.5, 2], sp = 0, raf = 0;
      players.push(audio);

      var draw = function () {
        var d = audio.duration || 0, p = d ? audio.currentTime / d : 0;
        var lit = Math.round(p * spans.length);
        for (var i = 0; i < spans.length; i++) spans[i].className = i < lit ? 'on' : '';
        knob.style.left = (p * 100) + '%';
        dur.textContent = fmt(audio.paused && !audio.currentTime ? d : audio.currentTime);
      };
      var loop = function () { draw(); if (!audio.paused) raf = requestAnimationFrame(loop); };

      audio.addEventListener('loadedmetadata', draw);
      audio.addEventListener('error', function () { dur.textContent = 'Файл жоқ'; });
      audio.addEventListener('play', function () {
        msg.classList.add('playing');
        btn.innerHTML = ICON_PAUSE; btn.setAttribute('aria-label', 'Тоқтату');
        cancelAnimationFrame(raf); loop();
      });
      audio.addEventListener('pause', function () {
        msg.classList.remove('playing');
        btn.innerHTML = ICON_PLAY; btn.setAttribute('aria-label', 'Тыңдау');
        cancelAnimationFrame(raf); draw();
      });
      audio.addEventListener('ended', function () {
        msg.classList.add('played');
        audio.currentTime = 0; draw();
      });

      btn.addEventListener('click', function () {
        if (audio.paused) {
          players.forEach(function (a) { if (a !== audio) a.pause(); });   // играет только одно
          audio.playbackRate = speeds[sp];
          var pr = audio.play(); if (pr && pr.catch) pr.catch(function () {});
        } else {
          audio.pause();
        }
      });
      speedBtn.addEventListener('click', function () {
        sp = (sp + 1) % speeds.length;
        audio.playbackRate = speeds[sp];
        speedBtn.textContent = String(speeds[sp]).replace('.', ',') + '×';
      });
      // Перемотка: нажать или провести пальцем по «волне»
      var seek = function (e) {
        if (!audio.duration) return;
        var r = wave.getBoundingClientRect();
        var p = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
        audio.currentTime = p * audio.duration; draw();
      };
      wave.addEventListener('pointerdown', function (e) {
        seek(e);
        wave.setPointerCapture && wave.setPointerCapture(e.pointerId);
        var move = function (ev) { seek(ev); };
        var up = function () { wave.removeEventListener('pointermove', move); wave.removeEventListener('pointerup', up); };
        wave.addEventListener('pointermove', move);
        wave.addEventListener('pointerup', up);
      });
    });
    document.getElementById('voices').hidden = false;
    markVoice();
  }

  /* ---------- Отзывы ---------- */
  if (REVIEWS.length) {
    var revBox = document.getElementById('reviewsRow');
    var revDots = document.getElementById('reviewsDots');
    document.getElementById('reviewsTitle').textContent = REVIEWS_TITLE;
    revBox.innerHTML = REVIEWS.map(function (r) {
      var letter = (r.name || '?').replace(/^[^A-Za-zА-Яа-яЁёӘәҒғҚқҢңӨөҰұҮүҺһІі]+/, '').charAt(0).toUpperCase() || '?';
      return '<article class="review">' +
        '<div class="who"><div class="ava">' +
          (r.photo ? '<img src="' + esc(r.photo) + '" alt="">' : esc(letter)) + '</div>' +
          '<div><b>' + esc(r.name) + '</b>' + (r.role ? '<span>' + esc(r.role) + '</span>' : '') + '</div></div>' +
        (r.image ? '<img class="shot" src="' + esc(r.image) + '" alt="Пікір" loading="lazy">' : '') +
        (r.text ? '<p>' + esc(r.text) + '</p>' : '') +
      '</article>';
    }).join('');
    revDots.innerHTML = REVIEWS.map(function () { return '<i></i>'; }).join('');
    var revCards = revBox.querySelectorAll('.review');
    var markRev = function () {
      var mid = revBox.scrollLeft + revBox.clientWidth / 2, best = 0, bestD = Infinity;
      for (var i = 0; i < revCards.length; i++) {
        var d = Math.abs(revCards[i].offsetLeft - revBox.offsetLeft + revCards[i].offsetWidth / 2 - mid);
        if (d < bestD) { bestD = d; best = i; }
      }
      for (var j = 0; j < revDots.children.length; j++) revDots.children[j].className = j === best ? 'on' : '';
    };
    revBox.addEventListener('scroll', markRev, { passive: true });
    document.getElementById('reviews').hidden = false;
    markRev();
  }

  /* ---------- Остаток мест и ноутбуков ----------
     Считается по числу уже показанных покупателей тарифа. Когда показаны все из BUYERS,
     числа совпадают с настоящими и дальше не меняются. */
  var cardEls = document.querySelectorAll('#cards .card');
  var shown = {};                       // сколько покупателей каждого тарифа уже показано
  function paint(i) {
    var t = TARIFFS[i], n = shown[t.name] || 0;
    var seatsEl = cardEls[i].querySelector('[data-seats]');
    if (seatsEl) {
      var left = Math.max(0, t.seatsTotal - n);
      var pct = Math.round(100 * left / t.seatsTotal);
      seatsEl.innerHTML = 'Қалған орын саны: <b>' + left + '</b> / ' + esc(t.seatsTotal) +
                          '<div class="bar"><i style="width:' + pct + '%"></i></div>';
    }
    var lapEl = cardEls[i].querySelector('[data-laptops]');
    if (lapEl) {
      var laptops = Math.max(0, t.laptops - n);
      lapEl.innerHTML = laptops > 1 ? 'Қалғаны: <i>' + laptops + '</i> / ' + esc(t.laptops)
        : laptops === 1 ? '<i class="last">Соңғы 1 ноутбук қалды</i>'
        : '<i class="last">Ноутбуктар таусылды</i>';
      cardEls[i].querySelector('.laptop').className = 'laptop' + (laptops ? '' : ' none');
    }
  }
  function paintAll() { for (var i = 0; i < TARIFFS.length; i++) paint(i); }

  /* ---------- Уведомления о реальных покупках: по одному имени из BUYERS ---------- */
  var PUSH_KEY = 'tarif_push_idx_v1';
  var idx = 0;                          // сколько уведомлений уже показано этому посетителю
  try {
    var saved = JSON.parse(localStorage.getItem(PUSH_KEY));
    if (saved && Date.now() - saved.ts < 12 * 60 * 60 * 1000) idx = Math.min(saved.idx, BUYERS.length);
  } catch (e) {}
  for (var q = 0; q < idx; q++) shown[BUYERS[q].tariff] = (shown[BUYERS[q].tariff] || 0) + 1;
  paintAll();

  if (idx < BUYERS.length && PUSH_EVERY_SEC > 0) {
    var toast = document.getElementById('toast');
    var pushTimer = null;
    var showNext = function () {
      // Каждое уведомление = минус одно место у тарифа покупателя.
      // Когда настоящие покупатели закончились — уведомления прекращаются (по кругу не идут).
      if (idx >= BUYERS.length) { clearInterval(pushTimer); return; }
      var b = BUYERS[idx];
      shown[b.tariff] = (shown[b.tariff] || 0) + 1;
      for (var i = 0; i < TARIFFS.length; i++) if (TARIFFS[i].name === b.tariff) paint(i);
      idx++;
      try { localStorage.setItem(PUSH_KEY, JSON.stringify({ idx: Math.min(idx, BUYERS.length), ts: Date.now() })); } catch (e) {}
      toast.innerHTML =
        '<div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>' +
        '<div><b>' + esc(b.name) + '</b><span><i>«' + esc(b.tariff) + '»</i> тарифін сатып алды</span></div>';
      toast.classList.add('show');
      setTimeout(function () { toast.classList.remove('show'); }, Math.min(3500, PUSH_EVERY_SEC * 700));
    };
    setTimeout(function () { showNext(); pushTimer = setInterval(showNext, PUSH_EVERY_SEC * 1000); }, 2000);
  }

  /* ---------- Таймер: TIMER_MINUTES, по окончании начинается заново ---------- */
  if (hasTimer) {
    var KEY = 'tarif_timer_start_v1';
    var LENGTH = TIMER_MINUTES * 60 * 1000;
    var start = 0;
    try { start = Number(localStorage.getItem(KEY)) || 0; } catch (e) {}
    var restart = function () {
      start = Date.now();
      try { localStorage.setItem(KEY, String(start)); } catch (e) {}
    };
    if (!start || start > Date.now() || Date.now() - start >= LENGTH) restart();

    var boxes = document.querySelectorAll('[data-timer]');
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    var tick = function () {
      var left = Math.ceil((start + LENGTH - Date.now()) / 1000);
      if (left <= 0) { restart(); left = TIMER_MINUTES * 60; }
      var html = '<span>Жеңілдік аяқталуына қалды</span><b>' +
                 pad(Math.floor(left / 60)) + ':' + pad(left % 60) + '</b>';
      for (var i = 0; i < boxes.length; i++) {
        boxes[i].className = 'timer' + (left <= 60 ? ' low' : '');
        boxes[i].innerHTML = html;
      }
    };
    setInterval(tick, 1000);
    tick();
  }
})();
</script>
</body>
</html>
